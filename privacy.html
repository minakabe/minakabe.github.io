<h1>プライバシーポリシー</h1>
<p>このアプリは、本人のパソコンで動く rclone が、本人の Google ドライブにファイルを書き込むためだけに使います。</p>
<ul>
<li>使う権限は <code>drive.file</code> だけです。このアプリが作ったファイル以外は読み書きしません。</li>
<li>Google ドライブのデータや認証情報は本人のパソコンにだけ保存し、第三者へ送ったり共有したりしません。</li>
<li>利用者は本人だけで、他の人のデータは扱いません。</li>
</ul>
<p>お問い合わせは <a href="https://github.com/minakabe/minakabe.github.io/issues">GitHub の Issues</a> へお願いします。</p>
